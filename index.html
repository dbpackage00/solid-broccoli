<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>동방포장 | DONGBANG PACKAGING</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      overflow-y: auto;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #142b4a;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    /* 하단 공장 사진 */
    .factory-bg {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 38vh;
      min-height: 280px;
      background-image: url('DbFactory_2.png');
      background-size: cover;
      background-position: center 60%;
      background-repeat: no-repeat;
      opacity: 0.22;
      z-index: 0;
      pointer-events: none;
    }

    /* 사진 위쪽을 흰색으로 자연스럽게 */
    .factory-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,1) 0%,
        rgba(255,255,255,0.95) 18%,
        rgba(255,255,255,0.65) 45%,
        rgba(255,255,255,0.20) 100%
      );
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
      padding: 55px 25px 110px;
    }

    .company {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .company-en {
      font-size: 13px;
      letter-spacing: 4px;
      color: #718096;
      margin-bottom: 42px;
    }

    .line {
      width: 45px;
      height: 2px;
      background: #142b4a;
      margin: 0 auto 32px;
    }

    h1 {
      font-size: 26px;
      font-weight: 500;
      margin: 0 0 16px;
    }

    .message {
      font-size: 16px;
      line-height: 1.8;
      color: #777;
      margin: 0;
    }

    /* 회사 정보 */
    .contact {
      width: fit-content;
      max-width: 100%;
      margin: 42px auto 0;
      padding: 30px 25px 0;
      border-top: 1px solid #e5e7eb;
    }

    .contact-row {
      display: grid;
      grid-template-columns: 28px 100px 1fr;
      align-items: center;
      column-gap: 10px;
      margin-bottom: 17px;
      font-size: 14px;
      line-height: 1.6;
    }

    .icon {
      text-align: center;
      font-size: 16px;
    }

    .label {
      text-align: left;
      font-weight: 600;
      color: #142b4a;
      white-space: nowrap;
    }

    .value {
      text-align: left;
      color: #666;
      white-space: nowrap;
    }

    .value a {
      color: #666;
      text-decoration: none;
    }

    .value a:hover {
      color: #142b4a;
      text-decoration: underline;
    }

    .footer {
      margin-top: 45px;
      padding-bottom: 20px;
      font-size: 11px;
      color: #999;
      letter-spacing: 1px;
    }

    /* 모바일 */
    @media (max-width: 600px) {
      .factory-bg {
        height: 32vh;
        min-height: 220px;
        background-position: center bottom;
      }

      .container {
        padding: 40px 15px 90px;
      }

      .company {
        font-size: 28px;
      }

      .company-en {
        font-size: 11px;
        letter-spacing: 3px;
        margin-bottom: 35px;
      }

      h1 {
        font-size: 22px;
      }

      .message {
        font-size: 14px;
      }

      .contact {
        padding-left: 5px;
        padding-right: 5px;
      }

      .contact-row {
        grid-template-columns: 24px 85px 1fr;
        column-gap: 6px;
        font-size: 12px;
      }

      .value {
        white-space: normal;
        word-break: keep-all;
      }
    }
  </style>
</head>

<body>

  <div class="factory-bg"></div>

  <main class="container">

    <div class="company">동방포장</div>
    <div class="company-en">DONGBANG PACKAGING</div>

    <div class="line"></div>

    <h1>홈페이지 리뉴얼 중입니다.</h1>

    <p class="message">
      보다 나은 서비스와 새로운 모습으로<br>
      곧 찾아뵙겠습니다.
    </p>

    <div class="contact">

      <div class="contact-row">
        <div class="icon">📍</div>
        <div class="label">본사 · 공장</div>
        <div class="value">경기도 군포시 농심로47번길 7 (당정동)</div>
      </div>

      <div class="contact-row">
        <div class="icon">☎</div>
        <div class="label">전화번호</div>
        <div class="value">
          <a href="tel:0314539495">031-453-9495</a>
        </div>
      </div>

      <div class="contact-row">
        <div class="icon">📠</div>
        <div class="label">팩스</div>
        <div class="value">031-458-1347</div>
      </div>

      <div class="contact-row">
        <div class="icon">📱</div>
        <div class="label">H.P</div>
        <div class="value">
          <a href="tel:01092686268">010-9268-6268</a>
        </div>
      </div>

      <div class="contact-row">
        <div class="icon">✉</div>
        <div class="label">이메일</div>
        <div class="value">
          <a href="mailto:dbpackg00@daum.net">dbpackg00@daum.net</a>
        </div>
      </div>

    </div>

    <div class="footer">
      © DONGBANG PACKAGING. ALL RIGHTS RESERVED.
    </div>

  </main>

</body>
</html>
