<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>동방포장 | DONGBANG PACKAGING</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #142b4a;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
      padding: 60px 25px;
    }

    /* 회사명 */
    .company {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .company-en {
      font-size: 13px;
      letter-spacing: 4px;
      color: #718096;
      margin-bottom: 42px;
    }

    .line {
      width: 45px;
      height: 2px;
      background: #142b4a;
      margin: 0 auto 32px;
    }

    /* 리뉴얼 안내 */
    h1 {
      font-size: 26px;
      font-weight: 500;
      margin: 0 0 16px;
    }

    .message {
      font-size: 16px;
      line-height: 1.8;
      color: #777;
      margin: 0;
    }

    /* 회사 정보 */
    .contact {
      max-width: 560px;
      margin: 42px auto 0;
      padding-top: 30px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }

    .contact-row {
      margin-bottom: 17px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      color: #666;
    }

    .icon {
      display: inline-block;
      margin-right: 7px;
      font-size: 15px;
      vertical-align: middle;
    }

    .label {
      font-weight: 600;
      color: #142b4a;
      margin-right: 7px;
    }

    .contact a {
      color: #666;
      text-decoration: none;
    }

    .contact a:hover {
      color: #142b4a;
      text-decoration: underline;
    }

    .footer {
      margin-top: 42px;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 45px 20px;
      }

      .company {
        font-size: 28px;
      }

      h1 {
        font-size: 22px;
      }

      .message {
        font-size: 14px;
      }

      .contact-row {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="company">동방포장</div>
    <div class="company-en">DONGBANG PACKAGING</div>

    <div class="line"></div>

    <h1>홈페이지 리뉴얼 중입니다.</h1>

    <p class="message">
      보다 나은 서비스와 새로운 모습으로<br>
      곧 찾아뵙겠습니다.
    </p>

    <div class="contact">

      <div class="contact-row">
        <span class="icon">📍</span>
        <span class="label">본사 · 공장</span>
        경기도 군포시 농심로47번길 7 (당정동)
      </div>

      <div class="contact-row">
        <span class="icon">☎</span>
        <span class="label">전화번호</span>
        <a href="tel:0314539495">031-453-9495</a>
      </div>

      <div class="contact-row">
        <span class="icon">📠</span>
        <span class="label">팩스</span>
        031-458-1347
      </div>

      <div class="contact-row">
        <span class="icon">📱</span>
        <span class="label">H.P</span>
        <a href="tel:01092686268">010-9268-6268</a>
      </div>

      <div class="contact-row">
        <span class="icon">✉</span>
        <span class="label">이메일</span>
        <a href="mailto:dbpackg00@daum.net">dbpackg00@daum.net</a>
      </div>

    </div>

    <div class="footer">
      © DONGBANG PACKAGING. ALL RIGHTS RESERVED.
    </div>

  </div>

</body>
</html>
